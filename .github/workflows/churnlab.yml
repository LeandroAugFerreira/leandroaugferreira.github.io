name: ChurnLab - geracao, SQL, ML, navegador e pacote

on:
  push:
    paths:
      - 'projects/churn-analytics/**'
      - '.github/workflows/churnlab.yml'
      - 'assets/churnlab-preview.css'
      - 'churn.html'
      - 'index.html'
  pull_request:
    paths:
      - 'projects/churn-analytics/**'
      - '.github/workflows/churnlab.yml'
      - 'assets/churnlab-preview.css'
      - 'churn.html'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/churn-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes Python - qualidade, SQL, temporalidade e reprodutibilidade
        run: python -m unittest discover -s tests -v
      - name: Testes JavaScript - taxas e filtros
        run: node --test tests/*.test.mjs
      - name: Empacotamento isolado sem caches ou secrets
        run: python scripts/package_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: churnlab-v2-standalone
          path: projects/churn-analytics/dist/churnlab-v2-standalone.zip
          if-no-files-found: error
          retention-days: 30
      - name: Validar extração e execucao Python/Node da versão portátil
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile
          import subprocess
          import sys
          with TemporaryDirectory() as temp:
              with ZipFile('dist/churnlab-v2-standalone.zip') as archive:
                  archive.extractall(temp)
              root = Path(temp) / 'churnlab-v2'
              assert (root/'src/generate.py').is_file()
              assert (root/'.github/workflows/ci.yml').is_file()
              subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-v'],cwd=root,check=True,timeout=60)
              subprocess.run(['node','--test','tests/ui.test.mjs'],cwd=root,check=True,timeout=30)
              print('PASS: ChurnLab portátil executa testes fora do repositório do portfólio')
          PY
      - name: Verificar que o pipeline nao editou originais
        run: git diff --exit-code -- data/ metrics.json model_card.json
  browser:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/churn-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias de desenvolvimento do Playwright
        run: npm install --no-audit --no-fund
      - name: Chromium para teste responsivo
        run: npx playwright install --with-deps chromium
      - name: E2E no desktop e no celular
        run: npx playwright test
      - name: Guardar screenshots e traces apenas como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churnlab-browser-desktop-mobile
          path: |
            projects/churn-analytics/artifacts/
            projects/churn-analytics/test-results/
          if-no-files-found: ignore
          retention-days: 14
