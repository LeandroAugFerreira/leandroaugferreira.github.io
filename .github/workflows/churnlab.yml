name: ChurnLab - dados sinteticos, SQL, ML e QA

on:
  push:
    branches:
      - main
      - feat/churn-reconstrucao-20261108
    paths:
      - projects/churn-analytics/**
      - .github/workflows/churnlab.yml
      - churn.html
      - index.html
  pull_request:
    paths:
      - projects/churn-analytics/**
      - .github/workflows/churnlab.yml
      - churn.html
      - index.html

jobs:
  generate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/churn-reconstrucao-20261108'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projects/churn-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar somente CSV sintetico com seed fixa
        run: python -m src.generate
      - name: Reconciliar SQLite, exportar agregados e experimento temporal
        run: python -m src.pipeline
      - name: Executar todos os testes (inclusive reproduzir arquivos em diretorios temporarios)
        run: python -m unittest discover -s tests -v
      - name: Versionar somente dados artificiais e agregados, na branch de trabalho
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/customers.csv data/monthly_observations.csv metrics.json model_card.json
          if ! git diff --cached --quiet; then
            git commit -m "data(churn): gerar base sintetica, metricas SQL e model card reproduziveis"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projects/churn-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar CSV, SQL, snapshots, splits e modelo
        run: python -m unittest discover -s tests -v
      - name: Confirmar que nao houve alteracoes durante a verificacao
        run: git diff --exit-code -- data/ metrics.json model_card.json
